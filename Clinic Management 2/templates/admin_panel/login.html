<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal Login | MedPulse Clinical Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 1.5rem;
        }
        .login-box {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 2.75rem 2.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .alert-badge {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-error { background: #fee2e2; color: #b91c1c; border-left: 4px solid #ef4444; }
        .alert-success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
    </style>
</head>
<body>

    <div class="login-box">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(135deg, #0284c7, #0d9488); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1.6rem; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35); margin-bottom: 0.75rem;">
                <i class="fas fa-user-md"></i>
            </div>
            <h2 style="font-size: 1.65rem; color: #0f172a; margin-bottom: 0.25rem;">Doctor Portal Access</h2>
            <p style="font-size: 0.875rem; color: #64748b;">Clinical Decision Support & OPD Consultation Desk</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-badge alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    <i class="fas fa-info-circle"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label"><i class="fas fa-id-badge text-primary"></i> Doctor ID *</label>
                <input type="text" name="doctor_id" id="doc_id_input" class="form-control" placeholder="e.g. DOC101" required value="DOC101">
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label class="form-label"><i class="fas fa-key text-primary"></i> Secret Password *</label>
                <input type="password" name="password" id="doc_pwd_input" class="form-control" placeholder="••••••••••••" required value="doctorpassword123">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1rem;">
                <i class="fas fa-sign-in-alt"></i> Login to Consultation Dashboard
            </button>
        </form>

        <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed #cbd5e1; text-align: center;">
            <span style="font-size: 0.8rem; color: #64748b; display: block; margin-bottom: 0.5rem;">Pre-configured Doctor Credentials:</span>
            <div style="background: #f1f5f9; padding: 0.6rem; border-radius: 8px; font-size: 0.8rem; color: #334155;">
                <strong>Doctor ID:</strong> DOC101 &nbsp;|&nbsp; <strong>Password:</strong> doctorpassword123
            </div>
            <div style="margin-top: 1rem;">
                <a href="/" style="font-size: 0.85rem; color: #0284c7; text-decoration: none; font-weight: 600;">
                    <i class="fas fa-arrow-left"></i> Return to Patient Public Site
                </a>
            </div>
        </div>
    </div>

</body>
</html>
